<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jobseeking Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f3f4f6;
      color: #1a1a1a;
      min-height: 100vh;
    }

    /* ── Header ── */
    .app-header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 0 24px;
      height: 54px;
      display: flex;
      align-items: center;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 200;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .logo {
      width: 30px; height: 30px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 800; font-size: 13px; letter-spacing: -0.5px;
      flex-shrink: 0;
    }
    .app-title { font-size: 16px; font-weight: 700; color: #111; }
    .header-sep { width: 1px; height: 22px; background: #e5e7eb; }
    .view-tabs { display: flex; gap: 2px; }
    .view-tab {
      padding: 5px 12px; border-radius: 6px; font-size: 13px;
      cursor: pointer; color: #6b7280; border: none; background: none;
      transition: all .15s; font-family: inherit;
    }
    .view-tab.active { background: #eff6ff; color: #3b82f6; font-weight: 600; }
    .header-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .btn-primary {
      background: #3b82f6; color: #fff; border: none; border-radius: 7px;
      padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
      font-family: inherit; transition: background .15s;
    }
    .btn-primary:hover { background: #2563eb; }

    /* ── Stats Bar ── */
    .stats-bar {
      display: flex; gap: 12px; padding: 16px 24px;
      background: #fff; border-bottom: 1px solid #e5e7eb;
      flex-wrap: wrap;
    }
    .stat-card {
      display: flex; align-items: center; gap: 12px;
      background: #fafafa; border: 1px solid #e5e7eb;
      border-radius: 10px; padding: 12px 18px; flex: 1; min-width: 140px;
    }
    .stat-icon {
      width: 38px; height: 38px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .stat-value { font-size: 24px; font-weight: 800; line-height: 1; }
    .stat-label {
      font-size: 10px; color: #9ca3af; margin-top: 3px;
      text-transform: uppercase; letter-spacing: 0.6px; font-weight: 600;
    }

    /* ── Table Section ── */
    .table-section { padding: 20px 24px 12px; }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .section-title { font-size: 14px; font-weight: 700; color: #374151; text-transform: uppercase; letter-spacing: 0.5px; }
    .table-wrapper {
      background: #fff; border-radius: 10px; border: 1px solid #e5e7eb;
      overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .table-scroll { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }

    thead th {
      background: #f9fafb; color: #6b7280; font-weight: 700;
      font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.65px;
      padding: 0 14px; height: 38px; text-align: left;
      border-bottom: 1px solid #e5e7eb; border-right: 1px solid #f0f0f0;
      white-space: nowrap; user-select: none; cursor: pointer;
    }
    thead th.no-sort { cursor: default; }
    thead th:last-child { border-right: none; }
    thead th.col-check { text-align: center; }
    thead th.col-num { text-align: center; width: 46px; cursor: default; }
    thead th.col-actions { width: 42px; cursor: default; }
    thead th.sorted-asc::after { content: ' ↑'; color: #3b82f6; }
    thead th.sorted-desc::after { content: ' ↓'; color: #3b82f6; }

    tbody tr { border-bottom: 1px solid #f3f4f6; transition: background .08s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f0f7ff; }
    tbody tr.selected { background: #eff6ff; }

    tbody td {
      padding: 0; border-right: 1px solid #f0f0f0;
      vertical-align: middle; height: 42px;
    }
    tbody td:last-child { border-right: none; }

    .td-inner {
      padding: 0 14px; height: 42px;
      display: flex; align-items: center;
    }
    .td-center { justify-content: center; }
    .td-num { color: #d1d5db; font-size: 11px; justify-content: center; }

    /* Date input */
    .date-input {
      border: none; background: transparent; font-size: 12px; color: #6b7280;
      font-family: inherit; cursor: pointer; width: 100%; padding: 0;
    }
    .date-input:focus { outline: none; color: #3b82f6; }

    /* Company input */
    .company-input {
      border: none; background: transparent; font-size: 13px; font-weight: 600;
      color: #111; font-family: inherit; cursor: text; width: 100%; padding: 0;
    }
    .company-input:focus { outline: none; }
    .company-input::placeholder { color: #d1d5db; font-weight: 400; }

    /* Stage status pill (auto-computed) */
    .status-pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 9px; border-radius: 20px;
      font-size: 11px; font-weight: 600; white-space: nowrap;
    }
    .status-pill .dot {
      width: 6px; height: 6px; border-radius: 50%; background: currentColor;
    }

    /* Custom checkbox — color is applied inline per phase */
    .stage-check {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; border: 1.5px solid #d1d5db;
      border-radius: 5px; cursor: pointer; transition: all .15s;
      background: #fff; user-select: none; flex-shrink: 0; position: relative;
    }
    .stage-check:hover { border-color: #9ca3af; background: #f9fafb; }
    .stage-check.checked {
      background: #22c55e; border-color: #22c55e;
    }
    .stage-check.checked::after {
      content: '';
      display: block; width: 5px; height: 9px;
      border: 2.5px solid #fff; border-top: none; border-left: none;
      transform: rotate(45deg) translateY(-1px);
    }

    /* Delete button */
    .delete-btn {
      opacity: 0; background: none; border: none; cursor: pointer;
      color: #9ca3af; font-size: 16px; width: 30px; height: 30px;
      border-radius: 5px; display: flex; align-items: center; justify-content: center;
      transition: all .1s; margin: auto; font-family: inherit;
    }
    tr:hover .delete-btn { opacity: 1; }
    .delete-btn:hover { background: #fee2e2; color: #ef4444; }

    /* Add row button */
    .add-row-btn {
      display: flex; align-items: center; gap: 8px; padding: 0 14px;
      height: 42px; color: #9ca3af; font-size: 13px; cursor: pointer;
      border: none; background: none; width: 100%; text-align: left;
      border-top: 1px solid #f0f0f0; transition: all .1s; font-family: inherit;
    }
    .add-row-btn:hover { background: #f9fafb; color: #6b7280; }
    .add-row-btn .plus { font-size: 16px; font-weight: 300; }

    /* ── Sankey Section ── */
    .sankey-section { padding: 0 24px 32px; }
    .sankey-wrapper {
      background: #fff; border-radius: 10px; border: 1px solid #e5e7eb;
      padding: 28px; box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .sankey-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 24px; }
    .sankey-title { font-size: 15px; font-weight: 700; color: #111; }
    .sankey-sub { font-size: 12px; color: #9ca3af; margin-top: 3px; }
    .sankey-legend { display: flex; gap: 16px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #6b7280; }
    .legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

    #sankey-svg { width: 100%; display: block; }

    .sankey-empty {
      display: flex; align-items: center; justify-content: center;
      height: 200px; color: #d1d5db; font-size: 13px;
    }

    /* ── Phases Section ── */
    .phases-section { padding: 20px 24px 32px; }
    .phases-wrapper {
      background: #fff; border-radius: 10px; border: 1px solid #e5e7eb;
      box-shadow: 0 1px 4px rgba(0,0,0,.06); overflow: hidden;
    }
    .phase-row {
      display: flex; align-items: center; gap: 12px; padding: 10px 16px;
      border-bottom: 1px solid #f3f4f6;
    }
    .phase-row:last-child { border-bottom: none; }
    .phase-reorder { display: flex; flex-direction: column; gap: 2px; }
    .phase-move {
      width: 20px; height: 16px; border: 1px solid #e5e7eb; background: #fff;
      border-radius: 4px; cursor: pointer; font-size: 10px; color: #6b7280;
      display: flex; align-items: center; justify-content: center; padding: 0;
      line-height: 1;
    }
    .phase-move:disabled { opacity: .3; cursor: default; }
    .phase-move:not(:disabled):hover { background: #f3f4f6; }
    .phase-color {
      width: 32px; height: 32px; border: 1px solid #e5e7eb; border-radius: 7px;
      cursor: pointer; padding: 2px; background: #fff; flex-shrink: 0;
    }
    .phase-name {
      flex: 1; border: 1px solid #e5e7eb; border-radius: 7px; padding: 7px 10px;
      font-size: 13px; font-family: inherit; color: #111; min-width: 0;
    }
    .phase-name:focus { outline: none; border-color: #3b82f6; }
    .phase-stats-toggle {
      display: flex; align-items: center; gap: 6px; font-size: 12px; color: #6b7280;
      white-space: nowrap; cursor: pointer; user-select: none; flex-shrink: 0;
    }
    .phase-delete {
      background: none; border: none; cursor: pointer; color: #9ca3af; font-size: 15px;
      width: 30px; height: 30px; border-radius: 5px; display: flex; align-items: center;
      justify-content: center; flex-shrink: 0; font-family: inherit;
    }
    .phase-delete:hover { background: #fee2e2; color: #ef4444; }
    .add-phase-btn {
      display: flex; align-items: center; gap: 8px; padding: 0 16px;
      height: 42px; color: #9ca3af; font-size: 13px; cursor: pointer;
      border: none; background: none; width: 100%; text-align: left;
      border-top: 1px solid #f0f0f0; transition: all .1s; font-family: inherit;
    }
    .add-phase-btn:hover { background: #f9fafb; color: #6b7280; }
    .phases-empty {
      padding: 32px 16px; text-align: center; color: #d1d5db; font-size: 13px;
    }

    /* Tooltip */
    .tooltip {
      position: fixed; background: rgba(17, 24, 39, 0.9);
      color: #fff; padding: 8px 13px; border-radius: 7px;
      font-size: 12px; pointer-events: none; z-index: 9999;
      opacity: 0; transition: opacity .12s; white-space: nowrap;
      backdrop-filter: blur(4px); box-shadow: 0 4px 12px rgba(0,0,0,.2);
    }
    .tooltip.show { opacity: 1; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
  </style>
</head>
<body>

<!-- ── Header ── -->
<header class="app-header">
  <div class="logo">JT</div>
  <span class="app-title">Jobseeking Tracker</span>
  <div class="header-sep"></div>
  <div class="view-tabs">
    <button class="view-tab active" onclick="showPage('grid', this)">Grid</button>
    <button class="view-tab" onclick="showPage('sankey', this)">Sankey chart</button>
    <button class="view-tab" onclick="showPage('phases', this)">Phases</button>
  </div>
  <div class="header-right">
    <button class="btn-primary" onclick="addRow()">+ Add Application</button>
  </div>
</header>

<!-- ── Grid page ── -->
<div id="page-grid">

<!-- ── Stats Bar ── -->
<div class="stats-bar" id="stats-bar"></div>

<!-- ── Table ── -->
<div class="table-section">
  <div class="section-header">
    <span class="section-title">All Applications</span>
  </div>
  <div class="table-wrapper">
    <div class="table-scroll">
      <table id="apps-table">
        <thead>
          <tr id="apps-thead-row"></tr>
        </thead>
        <tbody id="apps-tbody"></tbody>
      </table>
    </div>
    <button class="add-row-btn" onclick="addRow()">
      <span class="plus">+</span> Add application
    </button>
  </div>
</div>

</div><!-- end #page-grid -->

<!-- ── Sankey page ── -->
<div id="page-sankey" style="display:none">
<div class="sankey-section" style="padding-top:24px">
  <div class="sankey-wrapper">
    <div class="sankey-header">
      <div>
        <div class="sankey-title">Application Funnel</div>
        <div class="sankey-sub">Flow of applications through each phase — updates dynamically as you edit</div>
      </div>
      <div class="sankey-legend" id="sankey-legend"></div>
    </div>
    <svg id="sankey-svg"></svg>
  </div>
</div>

</div><!-- end .sankey-section --></div><!-- end #page-sankey -->

<!-- ── Phases page ── -->
<div id="page-phases" style="display:none">
<div class="phases-section">
  <div class="section-header">
    <span class="section-title">Application Phases</span>
  </div>
  <div class="phases-wrapper">
    <div id="phases-list"></div>
    <button class="add-phase-btn" onclick="addPhase()">
      <span class="plus">+</span> Add phase
    </button>
  </div>
</div>
</div><!-- end #page-phases -->

<div class="tooltip" id="tooltip"></div>

<script>
/* ─────────────────────────────────────────────
   PHASES (configurable, persisted client-side)
───────────────────────────────────────────── */
const DEFAULT_PHASES = [
  { id: 'recruiterAnswered', name: 'Recruiter Answered', color: '#10b981', inStats: true  },
  { id: 'followedUp',        name: 'Had to Follow-up',   color: '#f59e0b', inStats: false },
  { id: 'firstStage',        name: 'First Stage',        color: '#8b5cf6', inStats: true  },
  { id: 'technicalStage',    name: 'Technical Stage',    color: '#f59e0b', inStats: false },
  { id: 'pairProgramming',   name: 'Pair Programming',   color: '#ec4899', inStats: false },
  { id: 'offer',             name: 'Offer Stage',        color: '#3b82f6', inStats: true  },
];
const COLOR_PALETTE = ['#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#3b82f6', '#f43f5e', '#06b6d4', '#84cc16'];
const ROOT_COLOR = '#3b82f6';
const DROP_COLOR = '#94a3b8';

let phases = [];

/* ─────────────────────────────────────────────
   APPLICATIONS DATA
───────────────────────────────────────────── */
let applications = [
  { id:  1, date: '2026-01-08', company: 'Google',     phases: { recruiterAnswered: true,  followedUp: false, firstStage: true,  technicalStage: true,  pairProgramming: true,  offer: true  } },
  { id:  2, date: '2026-01-10', company: 'Meta',        phases: { recruiterAnswered: true,  followedUp: false, firstStage: true,  technicalStage: true,  pairProgramming: false, offer: false } },
  { id:  3, date: '2026-01-12', company: 'Stripe',      phases: { recruiterAnswered: true,  followedUp: false, firstStage: true,  technicalStage: false, pairProgramming: false, offer: false } },
  { id:  4, date: '2026-01-15', company: 'Airbnb',      phases: { recruiterAnswered: false, followedUp: true,  firstStage: false, technicalStage: false, pairProgramming: false, offer: false } },
  { id:  5, date: '2026-01-18', company: 'Netflix',     phases: { recruiterAnswered: false, followedUp: false, firstStage: false, technicalStage: false, pairProgramming: false, offer: false } },
  { id:  6, date: '2026-01-20', company: 'Uber',        phases: { recruiterAnswered: false, followedUp: true,  firstStage: false, technicalStage: false, pairProgramming: false, offer: false } },
  { id:  7, date: '2026-01-22', company: 'Spotify',     phases: { recruiterAnswered: true,  followedUp: false, firstStage: true,  technicalStage: true,  pairProgramming: true,  offer: false } },
  { id:  8, date: '2026-01-25', company: 'Twitter / X', phases: { recruiterAnswered: false, followedUp: false, firstStage: false, technicalStage: false, pairProgramming: false, offer: false } },
  { id:  9, date: '2026-01-28', company: 'Shopify',     phases: { recruiterAnswered: true,  followedUp: false, firstStage: false, technicalStage: false, pairProgramming: false, offer: false } },
  { id: 10, date: '2026-02-01', company: 'GitHub',      phases: { recruiterAnswered: true,  followedUp: true,  firstStage: true,  technicalStage: false, pairProgramming: false, offer: false } },
  { id: 11, date: '2026-02-03', company: 'Figma',       phases: { recruiterAnswered: true,  followedUp: false, firstStage: true,  technicalStage: true,  pairProgramming: false, offer: false } },
  { id: 12, date: '2026-02-05', company: 'Notion',      phases: { recruiterAnswered: false, followedUp: true,  firstStage: false, technicalStage: false, pairProgramming: false, offer: false } },
  { id: 13, date: '2026-02-08', company: 'Linear',      phases: { recruiterAnswered: true,  followedUp: false, firstStage: true,  technicalStage: false, pairProgramming: false, offer: false } },
  { id: 14, date: '2026-02-12', company: 'Vercel',      phases: { recruiterAnswered: false, followedUp: false, firstStage: false, technicalStage: false, pairProgramming: false, offer: false } },
  { id: 15, date: '2026-02-15', company: 'Anthropic',   phases: { recruiterAnswered: true,  followedUp: false, firstStage: true,  technicalStage: true,  pairProgramming: true,  offer: true  } },
];

let nextId = 16;
let sortField = 'date';
let sortDir = 'desc';

/* ─────────────────────────────────────────────
   HELPERS
───────────────────────────────────────────── */
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function genId() {
  return 'phase_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}
function hexToRgba(hex, alpha) {
  const h = (hex || '#6b7280').replace('#', '');
  const full = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
  const n = parseInt(full, 16) || 0;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return `rgba(${r},${g},${b},${alpha})`;
}

/* ─────────────────────────────────────────────
   STATUS HELPER (generic over configured phases)
───────────────────────────────────────────── */
function getStatus(app) {
  for (let i = phases.length - 1; i >= 0; i--) {
    const p = phases[i];
    if (app.phases[p.id]) {
      return { label: p.name || 'Untitled', color: p.color, bg: hexToRgba(p.color, 0.12) };
    }
  }
  return { label: 'Applied', color: '#6b7280', bg: '#f3f4f6' };
}

/* ─────────────────────────────────────────────
   TABLE RENDERING
───────────────────────────────────────────── */
function sorted() {
  const dir = sortDir === 'asc' ? 1 : -1;
  return [...applications].sort((a, b) => {
    let av, bv;
    if (sortField.startsWith('phase:')) {
      const pid = sortField.slice(6);
      av = a.phases[pid] ? 1 : 0;
      bv = b.phases[pid] ? 1 : 0;
    } else {
      av = a[sortField]; bv = b[sortField];
      if (typeof av === 'boolean') av = av ? 1 : 0;
      if (typeof bv === 'boolean') bv = bv ? 1 : 0;
    }
    if (av < bv) return -1 * dir;
    if (av > bv) return  1 * dir;
    return 0;
  });
}

function renderTableHead() {
  const row = document.getElementById('apps-thead-row');
  row.innerHTML = `
    <th class="col-num no-sort">#</th>
    <th data-sort="date">Date Applied</th>
    <th data-sort="company">Company</th>
    ${phases.map(p => `<th class="col-check" data-sort="phase:${p.id}">${escapeHtml(p.name) || '—'}</th>`).join('')}
    <th class="col-actions no-sort"></th>
  `;
  row.querySelectorAll('th[data-sort]').forEach(th => {
    th.addEventListener('click', () => {
      const field = th.dataset.sort;
      if (sortField === field) {
        sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        sortField = field;
        sortDir = 'asc';
      }
      renderTable();
    });
  });
  updateSortHeaders();
}

function renderTable() {
  renderTableHead();
  const tbody = document.getElementById('apps-tbody');
  tbody.innerHTML = '';

  sorted().forEach((app, idx) => {
    const st = getStatus(app);
    const tr = document.createElement('tr');
    tr.dataset.id = app.id;

    tr.innerHTML = `
      <td><div class="td-inner td-num">${idx + 1}</div></td>
      <td>
        <div class="td-inner">
          <input type="date" class="date-input" value="${app.date}"
            onchange="updateApp(${app.id},'date',this.value)">
        </div>
      </td>
      <td>
        <div class="td-inner" style="gap:10px">
          <input type="text" class="company-input" value="${escapeHtml(app.company)}"
            placeholder="Company name"
            oninput="updateApp(${app.id},'company',this.value)">
          <span class="status-pill" style="color:${st.color};background:${st.bg}">
            <span class="dot"></span>${escapeHtml(st.label)}
          </span>
        </div>
      </td>
      ${phases.map(p => {
        const checked = !!app.phases[p.id];
        const style = checked ? `background:${p.color};border-color:${p.color}` : '';
        return `<td><div class="td-inner td-center">
          <div class="stage-check ${checked ? 'checked' : ''}" style="${style}"
            onclick="togglePhase(${app.id},'${p.id}',this)"></div>
        </div></td>`;
      }).join('')}
      <td><div class="td-inner td-center">
        <button class="delete-btn" onclick="deleteRow(${app.id})" title="Delete row">×</button>
      </div></td>
    `;
    tbody.appendChild(tr);
  });
}

function updateSortHeaders() {
  document.querySelectorAll('#apps-thead-row th[data-sort]').forEach(th => {
    th.classList.remove('sorted-asc', 'sorted-desc');
    if (th.dataset.sort === sortField) {
      th.classList.add(sortDir === 'asc' ? 'sorted-asc' : 'sorted-desc');
    }
  });
}

/* ─────────────────────────────────────────────
   DATA MUTATIONS — APPLICATIONS
───────────────────────────────────────────── */
function refreshRow(app) {
  const st = getStatus(app);
  const row = document.querySelector(`tr[data-id="${app.id}"]`);
  if (row) {
    const pill = row.querySelector('.status-pill');
    if (pill) {
      pill.style.color = st.color;
      pill.style.background = st.bg;
      pill.innerHTML = `<span class="dot"></span>${escapeHtml(st.label)}`;
    }
  }
}

function updateApp(id, field, value) {
  const app = applications.find(a => a.id === id);
  if (!app) return;
  app[field] = value;
  saveData();
  refreshRow(app);
  renderStats();
}

function togglePhase(id, phaseId, el) {
  const app = applications.find(a => a.id === id);
  if (!app) return;
  app.phases[phaseId] = !app.phases[phaseId];
  const phase = phases.find(p => p.id === phaseId);
  el.classList.toggle('checked', app.phases[phaseId]);
  el.style.background = app.phases[phaseId] && phase ? phase.color : '';
  el.style.borderColor = app.phases[phaseId] && phase ? phase.color : '';
  refreshRow(app);
  saveData();
  renderStats();
}

function addRow() {
  const today = new Date().toISOString().split('T')[0];
  applications.unshift({ id: nextId++, date: today, company: '', phases: {} });
  saveData();
  renderTable();
  renderStats();
  const inputs = document.querySelectorAll('.company-input');
  if (inputs.length) inputs[0].focus({ preventScroll: true });
}

function deleteRow(id) {
  applications = applications.filter(a => a.id !== id);
  saveData();
  renderTable();
  renderStats();
}

/* ─────────────────────────────────────────────
   DATA MUTATIONS — PHASES
───────────────────────────────────────────── */
function renderPhasesPage() {
  const wrap = document.getElementById('phases-list');
  if (!phases.length) {
    wrap.innerHTML = '<div class="phases-empty">No phases yet — add one below.</div>';
    return;
  }
  wrap.innerHTML = phases.map((p, i) => `
    <div class="phase-row" data-id="${p.id}">
      <div class="phase-reorder">
        <button class="phase-move" onclick="movePhase(${i},-1)" ${i === 0 ? 'disabled' : ''} title="Move up">↑</button>
        <button class="phase-move" onclick="movePhase(${i},1)" ${i === phases.length - 1 ? 'disabled' : ''} title="Move down">↓</button>
      </div>
      <input type="color" class="phase-color" value="${p.color}" onchange="updatePhase('${p.id}','color',this.value)">
      <input type="text" class="phase-name" value="${escapeHtml(p.name)}" placeholder="Phase name"
        oninput="updatePhase('${p.id}','name',this.value)">
      <label class="phase-stats-toggle">
        <input type="checkbox" ${p.inStats ? 'checked' : ''} onchange="updatePhase('${p.id}','inStats',this.checked)">
        Show in stats bar
      </label>
      <button class="phase-delete" onclick="deletePhase('${p.id}')" title="Delete phase">🗑</button>
    </div>
  `).join('');
}

function updatePhase(id, field, value) {
  const phase = phases.find(p => p.id === id);
  if (!phase) return;
  phase[field] = value;
  savePhases();
  renderTable();
  renderStats();
}

function movePhase(index, delta) {
  const target = index + delta;
  if (target < 0 || target >= phases.length) return;
  [phases[index], phases[target]] = [phases[target], phases[index]];
  savePhases();
  renderPhasesPage();
  renderTable();
  renderStats();
}

function addPhase() {
  const phase = { id: genId(), name: '', color: COLOR_PALETTE[phases.length % COLOR_PALETTE.length], inStats: false };
  phases.push(phase);
  savePhases();
  renderPhasesPage();
  renderTable();
  renderStats();
  const names = document.querySelectorAll('.phase-name');
  if (names.length) names[names.length - 1].focus();
}

function deletePhase(id) {
  const phase = phases.find(p => p.id === id);
  if (!phase) return;
  const count = applications.filter(a => a.phases[id]).length;
  const msg = count > 0
    ? `Delete phase "${phase.name || 'Untitled'}"? ${count} application${count !== 1 ? 's' : ''} have this checked and will lose that data.`
    : `Delete phase "${phase.name || 'Untitled'}"?`;
  if (!confirm(msg)) return;
  phases = phases.filter(p => p.id !== id);
  applications.forEach(a => { delete a.phases[id]; });
  savePhases();
  saveData();
  renderPhasesPage();
  renderTable();
  renderStats();
}

/* ─────────────────────────────────────────────
   STATS
───────────────────────────────────────────── */
const STAT_ICONS = ['💬', '🎯', '🎉', '⭐', '🔥', '✅', '📌', '🚀'];

function renderStats() {
  const n = applications.length;
  const pct = (x) => n > 0 ? Math.round(x / n * 100) + '%' : '—';

  const items = [
    { value: n, label: 'Total Applied', icon: '📋', color: '#3b82f6', bg: '#eff6ff' },
  ];

  phases.filter(p => p.inStats).forEach((p, i) => {
    const count = applications.filter(a => a.phases[p.id]).length;
    items.push({
      value: pct(count),
      label: p.name || 'Untitled',
      icon: STAT_ICONS[i % STAT_ICONS.length],
      color: p.color,
      bg: hexToRgba(p.color, 0.12),
    });
  });

  document.getElementById('stats-bar').innerHTML = items.map(s => `
    <div class="stat-card">
      <div class="stat-icon" style="background:${s.bg}">${s.icon}</div>
      <div>
        <div class="stat-value" style="color:${s.color}">${s.value}</div>
        <div class="stat-label">${escapeHtml(s.label)}</div>
      </div>
    </div>
  `).join('');
}

/* ─────────────────────────────────────────────
   SANKEY (funnel chained dynamically over phases)
───────────────────────────────────────────── */
function buildSankeyData() {
  const total = applications.length;
  if (!total || !phases.length) return null;

  const nodeArr = [];
  const linkArr = [];
  const idx = {};

  function node(name, color) {
    if (!(name in idx)) { idx[name] = nodeArr.length; nodeArr.push({ name, color }); }
    return name;
  }
  function link(src, tgt, val) {
    if (val > 0) linkArr.push({ source: idx[src], target: idx[tgt], value: val });
  }

  node('Applied', ROOT_COLOR);
  let prevLabel = 'Applied';
  let prevCount = total;

  phases.forEach(p => {
    const label = p.name || 'Untitled';
    const checkedCount = applications.filter(a => a.phases[p.id]).length;
    const dropped = prevCount - checkedCount;
    const dropLabel = `Dropped (${label})`;

    if (dropped > 0 && prevCount > 0) {
      node(dropLabel, DROP_COLOR);
      link(prevLabel, dropLabel, dropped);
    }

    // Only advance the chain to this phase's own node when it actually
    // has one (checkedCount > 0) — otherwise idx[label] would be
    // undefined and the next link() call would reference a missing node.
    if (checkedCount > 0) {
      node(label, p.color);
      link(prevLabel, label, checkedCount);
      prevLabel = label;
    }
    prevCount = checkedCount;
  });

  return { nodes: nodeArr, links: linkArr };
}

function buildLegend(data) {
  const items = [];
  const seen = new Set();
  data.nodes.forEach(n => {
    if (n.name.startsWith('Dropped (')) return;
    const key = n.name + n.color;
    if (seen.has(key)) return;
    seen.add(key);
    items.push({ label: n.name, color: n.color });
  });
  if (data.nodes.some(n => n.name.startsWith('Dropped ('))) {
    items.push({ label: 'Dropped', color: DROP_COLOR });
  }
  return items;
}

function renderSankey() {
  const svgEl = document.getElementById('sankey-svg');
  svgEl.innerHTML = '';

  const data = buildSankeyData();
  if (!data || data.nodes.length < 2) {
    svgEl.setAttribute('height', 80);
    const msg = !phases.length ? 'Add phases to see the funnel' : 'Add applications to see the funnel';
    svgEl.innerHTML = `<text x="50%" y="50%" text-anchor="middle" fill="#d1d5db" dy=".3em" font-size="14" font-family="system-ui">${msg}</text>`;
    document.getElementById('sankey-legend').innerHTML = '';
    return;
  }

  const W = svgEl.parentElement.clientWidth - 56;
  const H = Math.max(340, Math.min(460, data.nodes.length * 38));
  const margin = { t: 12, r: 180, b: 12, l: 12 };

  svgEl.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svgEl.setAttribute('height', H);

  const sankey = d3.sankey()
    .nodeWidth(18)
    .nodePadding(14)
    .extent([[margin.l, margin.t], [W - margin.r, H - margin.b]])
    .nodeAlign(d3.sankeyLeft);

  const graph = sankey({
    nodes: data.nodes.map(d => ({ ...d })),
    links: data.links.map(d => ({ ...d })),
  });

  const svg = d3.select(svgEl);
  const defs = svg.append('defs');

  // Gradient per link
  graph.links.forEach((lk, i) => {
    const g = defs.append('linearGradient')
      .attr('id', `sg${i}`)
      .attr('gradientUnits', 'userSpaceOnUse')
      .attr('x1', lk.source.x1).attr('x2', lk.target.x0);
    g.append('stop').attr('offset', '0%')
      .attr('stop-color', lk.source.color).attr('stop-opacity', 0.45);
    g.append('stop').attr('offset', '100%')
      .attr('stop-color', lk.target.color).attr('stop-opacity', 0.45);
  });

  // Links
  svg.append('g').selectAll('path')
    .data(graph.links)
    .join('path')
      .attr('d', d3.sankeyLinkHorizontal())
      .attr('stroke', (_, i) => `url(#sg${i})`)
      .attr('stroke-width', d => Math.max(2, d.width))
      .attr('fill', 'none')
      .style('cursor', 'default')
      .on('mouseover', function(ev, d) {
        d3.select(this).attr('stroke-opacity', 1);
        showTip(ev, `${d.source.name} → ${d.target.name}: ${d.value} application${d.value!==1?'s':''}`);
      })
      .on('mousemove', moveTip)
      .on('mouseout', function() {
        d3.select(this).attr('stroke-opacity', null);
        hideTip();
      });

  // Nodes
  const ng = svg.append('g').selectAll('g')
    .data(graph.nodes)
    .join('g')
      .style('cursor', 'default')
      .on('mouseover', (ev, d) => showTip(ev, `${d.name}: ${d.value} application${d.value!==1?'s':''}`))
      .on('mousemove', moveTip)
      .on('mouseout', hideTip);

  ng.append('rect')
    .attr('x', d => d.x0).attr('y', d => d.y0)
    .attr('width', d => d.x1 - d.x0)
    .attr('height', d => Math.max(2, d.y1 - d.y0))
    .attr('fill', d => d.color)
    .attr('rx', 4);

  // Labels
  ng.append('text')
    .attr('y', d => (d.y0 + d.y1) / 2)
    .attr('dy', '0.35em')
    .attr('font-size', 12)
    .attr('font-family', 'system-ui, -apple-system, sans-serif')
    .attr('fill', '#374151')
    .attr('font-weight', 600)
    .each(function(d) {
      const isRight = d.x1 > W - margin.r - 10;
      d3.select(this)
        .attr('x', isRight ? d.x0 - 8 : d.x1 + 8)
        .attr('text-anchor', isRight ? 'end' : 'start')
        .text(`${d.name} (${d.value})`);
    });

  // Legend
  const legendData = buildLegend(data);
  document.getElementById('sankey-legend').innerHTML = legendData.map(l => `
    <div class="legend-item">
      <div class="legend-dot" style="background:${l.color}"></div>
      ${escapeHtml(l.label)}
    </div>
  `).join('');
}

/* ─────────────────────────────────────────────
   TOOLTIP
───────────────────────────────────────────── */
const tip = document.getElementById('tooltip');
function showTip(ev, text) {
  tip.textContent = text;
  tip.classList.add('show');
  moveTip(ev);
}
function moveTip(ev) {
  tip.style.left = (ev.clientX + 14) + 'px';
  tip.style.top  = (ev.clientY - 34) + 'px';
}
function hideTip() { tip.classList.remove('show'); }

/* ─────────────────────────────────────────────
   PERSISTENCE
───────────────────────────────────────────── */
function saveData() {
  try {
    localStorage.setItem('jt_apps', JSON.stringify(applications));
    localStorage.setItem('jt_nextId', nextId);
  } catch(_) {}
}

function migrateApp(app) {
  if (app.phases) return app;
  const legacyKeys = ['recruiterAnswered', 'followedUp', 'firstStage', 'technicalStage', 'pairProgramming', 'offer'];
  const phasesObj = {};
  legacyKeys.forEach(k => {
    if (k in app) {
      phasesObj[k] = !!app[k];
      delete app[k];
    }
  });
  app.phases = phasesObj;
  return app;
}

function loadData() {
  try {
    const saved = localStorage.getItem('jt_apps');
    if (saved) {
      applications = JSON.parse(saved).map(migrateApp);
      nextId = parseInt(localStorage.getItem('jt_nextId') || applications.length + 1);
    }
  } catch(_) {}
}

function savePhases() {
  try {
    localStorage.setItem('jt_phases', JSON.stringify(phases));
  } catch(_) {}
}

function loadPhases() {
  try {
    const saved = localStorage.getItem('jt_phases');
    phases = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(DEFAULT_PHASES));
  } catch(_) {
    phases = JSON.parse(JSON.stringify(DEFAULT_PHASES));
  }
}

/* ─────────────────────────────────────────────
   NAVIGATION
───────────────────────────────────────────── */
function showPage(name, btn) {
  document.getElementById('page-grid').style.display   = name === 'grid'   ? '' : 'none';
  document.getElementById('page-sankey').style.display = name === 'sankey' ? '' : 'none';
  document.getElementById('page-phases').style.display = name === 'phases' ? '' : 'none';
  document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  if (name === 'sankey') renderSankey();
  if (name === 'phases') renderPhasesPage();
}

/* ─────────────────────────────────────────────
   INIT
───────────────────────────────────────────── */
loadPhases();
loadData();
renderTable();
renderStats();

window.addEventListener('resize', () => {
  if (document.getElementById('page-sankey').style.display !== 'none') renderSankey();
});
</script>
