<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>HealthScanner &mdash; Full-Body Diagnostic</title>
<meta name="description" content="An interactive 3D body scan that maps every region to a concrete self-care recommendation.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0d12'/%3E%3Cpath d='M6 16h5l2-7 4 14 3-9 2 4h4' fill='none' stroke='%23e2a253' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="scan-veil" id="scanVeil" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-text">HEALTH<em>SCANNER</em></span>
  </div>
  <p class="kicker">FULL&#8209;BODY DIAGNOSTIC &middot; 9 REGIONS MAPPED</p>
</header>

<main class="stage">

  <section class="viewport-panel" aria-label="3D body model">
    <div class="gender-toggle" role="radiogroup" aria-label="Model">
      <button type="button" class="gender-btn is-active" id="btnFemale" role="radio" aria-checked="true">FEMALE</button>
      <button type="button" class="gender-btn" id="btnMale" role="radio" aria-checked="false">MALE</button>
      <span class="gender-thumb" id="genderThumb" aria-hidden="true"></span>
    </div>

    <canvas id="scene" aria-hidden="true"></canvas>

    <div class="readout">
      <span id="readoutLine">SCAN&nbsp;INTEGRITY <b>100%</b></span>
      <span class="readout-sep">/</span>
      <span>DRAG TO ROTATE &middot; SCROLL TO ZOOM</span>
    </div>
  </section>

  <section class="report-panel" aria-label="Recommendations by body region">
    <div class="report-head">
      <h1>Scan Report</h1>
      <p>Every pass of the sensor flags a region and pairs it with one thing worth doing about it.</p>
    </div>

    <ol class="report-list" id="reportList">
      <!-- rows injected by main.js -->
    </ol>
  </section>

</main>

<svg id="wires" class="wires" aria-hidden="true"></svg>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>
<script type="module" src="main.js"></script>
</body>
</html>
